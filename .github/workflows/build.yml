name: Build Boards

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build bread-compact-esp32
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Merge Binary
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py bread-compact-esp32 --name bread-compact-esp32
          
          # 0x0 অ্যাড্রেসের স্বয়ংসম্পূর্ণ ফ্ল্যাশ ফাইল তৈরি
          if [ -f build/bread-compact-esp32/flash_args ]; then
            cd build/bread-compact-esp32 && esptool.py --chip esp32s3 merge_bin -o ../../full-firmware.bin @flash_args && cd ../..
          elif [ -f build/flash_args ]; then
            cd build && esptool.py --chip esp32s3 merge_bin -o ../full-firmware.bin @flash_args && cd ..
          elif [ -f build/merged-binary.bin ]; then
            cp build/merged-binary.bin full-firmware.bin
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_full_firmware_${{ github.sha }}
          path: full-firmware.bin
          if-no-files-found: error
