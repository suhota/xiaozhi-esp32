name: Build Boards

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build bread-compact-esp32
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build current variant
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python -m pip install --upgrade idf-component-manager
          python scripts/build.py bread-compact-esp32 --name bread-compact-esp32

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_bread-compact-esp32_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
